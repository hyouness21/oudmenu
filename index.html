<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/oud-logoo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2E8D9" />
    <title>Oud | عود</title>
    <link rel="preload" as="image" href="/oud-logoo.png" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      #tea-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #F7F2E2;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #tl-logo {
        position: absolute;
        top: 13%;
        left: 50%;
        transform: translateX(-50%);
        height: 84px;
        width: auto;
      }
      #tl-svg-wrap {
        width: 88vw;
        max-width: 340px;
      }
      #tl-svg-wrap svg {
        width: 100%;
        height: auto;
        overflow: visible;
      }
      #tl-stream {
        transition: opacity 0.3s;
      }
      #tl-pot {
        transform: rotate(8deg);
        transform-box: view-box;
        transform-origin: 220px 120px;
        transition: transform 0.5s ease-in-out;
      }
      #tl-steam-group {
        transition: opacity 0.4s;
      }
      #tl-label {
        position: absolute;
        left: 28px;
        bottom: 44px;
        font-family: Lato, sans-serif;
        font-size: 13px;
        letter-spacing: 1px;
        color: #5F6430;
        margin: 0;
      }
      #tl-counter-wrap {
        position: absolute;
        right: 26px;
        bottom: 30px;
        display: flex;
        align-items: baseline;
        gap: 2px;
      }
      #tl-counter {
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 500;
        font-size: 64px;
        line-height: 1;
        color: #5C7249;
      }
      #tl-pct {
        font-family: Lato, sans-serif;
        font-weight: 700;
        font-size: 20px;
        color: #C9A84C;
      }
      @keyframes tl-steam {
        0%   { transform: translateY(6px);   opacity: 0; }
        25%  { opacity: 0.8; }
        100% { transform: translateY(-26px); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="tea-loader">
      <img id="tl-logo" src="/oud-logoo.png" alt="OUD" />
      <div id="tl-svg-wrap">
        <svg viewBox="0 0 300 352" role="img" aria-label="A green teapot pouring tea into a white cup">
          <defs>
            <linearGradient id="tl-potGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#A8BF97"/>
              <stop offset="1" stop-color="#7B956A"/>
            </linearGradient>
            <linearGradient id="tl-cupGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#FFFFFF"/>
              <stop offset=".7" stop-color="#FFFAF0"/>
              <stop offset="1" stop-color="#EFE3CF"/>
            </linearGradient>
            <clipPath id="tl-cupInside">
              <path d="M91 231 C 93 279, 119 301, 150 301 C 181 301, 207 279, 209 231 Z"/>
              <ellipse cx="150" cy="231" rx="59" ry="7.5"/>
            </clipPath>
          </defs>

          <ellipse cx="150" cy="306" rx="96" ry="10" fill="#EFE3CF"/>
          <path d="M206 246 C 236 240, 238 278, 202 282" fill="none" stroke="#F2E8D9" stroke-width="9" stroke-linecap="round"/>
          <ellipse cx="150" cy="231" rx="60" ry="8" fill="#F2E8D9"/>
          <path d="M90 231 C 92 280, 118 302, 150 302 C 182 302, 208 280, 210 231 A 60 8 0 0 1 90 231 Z" fill="#FFFFFF"/>

          <g clip-path="url(#tl-cupInside)">
            <!-- start fully translated down (empty cup); script updates each frame -->
            <g id="tl-tea-level" transform="translate(0,74)">
              <rect x="86" y="231" width="128" height="76" fill="#8B6B3D"/>
              <ellipse cx="150" cy="231" rx="59" ry="7.5" fill="#8B6B3D"/>
            </g>
          </g>

          <path d="M90 231 C 92 280, 118 302, 150 302 C 182 302, 208 280, 210 231 A 60 8 0 0 1 90 231 Z" fill="url(#tl-cupGrad)" fill-opacity=".72"/>
          <path d="M136 300 Q 150 306 164 300" fill="none" stroke="#C9A84C" stroke-width="3" stroke-linecap="round"/>
          <path d="M150 252 L166 264 L150 276 L134 264 Z" fill="none" stroke="#C9A84C" stroke-width="2"/>
          <ellipse cx="150" cy="231" rx="60" ry="8" fill="none" stroke="#D4BC99" stroke-width="2"/>

          <path id="tl-stream" d="M143 147 C 147 172, 151 196, 150 230" fill="none" stroke="#8B6B3D" stroke-width="4.5" stroke-linecap="round" style="opacity:0"/>

          <g transform="rotate(-20 220 120)">
            <g id="tl-pot">
              <path d="M262 92 C 302 80, 304 142, 262 140" fill="none" stroke="#879E76" stroke-width="10" stroke-linecap="round"/>
              <path d="M180 132 C 162 134, 152 122, 140 116" fill="none" stroke="#A8BF97" stroke-width="12" stroke-linecap="round"/>
              <circle cx="140" cy="116" r="4" fill="#C9A84C"/>
              <ellipse cx="220" cy="122" rx="52" ry="46" fill="url(#tl-potGrad)"/>
              <ellipse cx="198" cy="100" rx="20" ry="11" fill="#FFFAF0" opacity=".35" transform="rotate(-25 198 100)"/>
              <path d="M170 132 Q 220 168 270 122" fill="none" stroke="#C9A84C" stroke-width="2.5"/>
              <ellipse cx="216" cy="80" rx="30" ry="10" fill="#879E76"/>
              <circle cx="216" cy="67" r="9" fill="#A8BF97"/>
            </g>
          </g>

          <g id="tl-steam-group" style="opacity:0">
            <path d="M136 212 q -6 -8 0 -16 q 6 -8 0 -16" fill="none" stroke="#D4BC99" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M152 212 q -6 -8 0 -16 q 6 -8 0 -16" fill="none" stroke="#D4BC99" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M166 212 q -6 -8 0 -16 q 6 -8 0 -16" fill="none" stroke="#D4BC99" stroke-width="2.5" stroke-linecap="round"/>
          </g>
        </svg>
      </div>

      <span id="tl-label">Pouring your tea…</span>

      <div id="tl-counter-wrap">
        <span id="tl-counter" aria-live="polite">0</span><span id="tl-pct">%</span>
      </div>
    </div>

    <script>
    (function () {
      var loader = document.getElementById('tea-loader');
      if (!loader) return;

      // Nothing to do on admin pages — remove immediately
      if (window.location.pathname.startsWith('/admin')) {
        loader.remove();
        return;
      }

      document.body.style.overflow = 'hidden';

      // Curve constants — identical to TeaLoader.jsx
      var TA = 0.3, TB = 1.2, TC = 0.3;
      var HOLD_MS = 600, FADE_MS = 400, TIMEOUT_MS = 15000;

      var teaEl      = document.getElementById('tl-tea-level');
      var streamEl   = document.getElementById('tl-stream');
      var potEl      = document.getElementById('tl-pot');
      var steamEl    = document.getElementById('tl-steam-group');
      var steamPaths = steamEl ? steamEl.querySelectorAll('path') : [];
      var counterEl  = document.getElementById('tl-counter');

      var done     = false;   // set true when React signals all data loaded
      var finished = false;   // set true once fade-out begins
      var virtT    = 0;       // virtual elapsed seconds on the natural curve
      var lastT    = null;    // previous rAF timestamp (ms)
      var rafId    = null;

      function getPct(t) {
        if (t <= 0) return 0;
        if (t <= TA) return 10 * Math.pow(t / TA, 2);
        if (t <= TA + TB) return 10 + (80 / TB) * (t - TA);
        var t3 = Math.min(t - TA - TB, TC);
        return 100 - 10 * Math.pow((TC - t3) / TC, 2);
      }

      function getT(pct) {
        if (pct <= 0) return 0;
        if (pct <= 10) return TA * Math.sqrt(pct / 10);
        if (pct <= 90) return TA + (pct - 10) * TB / 80;
        return TA + TB + TC - TC * Math.sqrt((100 - pct) / 10);
      }

      function applyPct(pct) {
        var teaY = 74 * (1 - pct / 100);
        if (teaEl) teaEl.setAttribute('transform', 'translate(0,' + teaY + ')');

        var pouring = pct > 2 && pct < 100;
        if (streamEl) streamEl.style.opacity = pouring ? '1' : '0';
        if (potEl)    potEl.style.transform  = 'rotate(' + (pouring ? 0 : 8) + 'deg)';

        if (steamEl) {
          var steam = pct >= 100;
          steamEl.style.opacity = steam ? '1' : '0';
          if (steam) {
            steamPaths.forEach(function (p, i) {
              if (!p.style.animation) {
                p.style.animation = 'tl-steam 2.4s ease-out infinite ' + (i * 0.8) + 's';
              }
            });
          }
        }

        if (counterEl) counterEl.textContent = Math.round(pct);
      }

      function fadeOut() {
        if (finished) return;
        finished = true;
        if (rafId) cancelAnimationFrame(rafId);
        loader.style.transition = 'opacity ' + FADE_MS + 'ms ease';
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.remove();
          document.body.style.overflow = '';
        }, FADE_MS);
      }

      // prefers-reduced-motion: skip animation, full cup, fade on signal
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        applyPct(100);
        window.oudLoaderDone = function () { if (!finished) fadeOut(); };
        setTimeout(function () { if (!finished) fadeOut(); }, TIMEOUT_MS);
        return;
      }

      // Safety: if React never signals, finish after 15 s anyway
      setTimeout(function () { done = true; }, TIMEOUT_MS);

      function frame(now) {
        var dt = lastT === null ? 0 : (now - lastT) / 1000;
        lastT = now;

        var proposed = virtT + dt;
        // Hold at 90 while data is still loading
        if (!done && getPct(proposed) >= 90) {
          virtT = getT(90);
        } else {
          virtT = proposed;
        }

        var raw = getPct(virtT);

        if (raw >= 100) {
          applyPct(100);
          setTimeout(fadeOut, HOLD_MS);
          return; // stop the loop
        }

        applyPct(raw);
        rafId = requestAnimationFrame(frame);
      }

      // Called by React (TeaLoader.jsx) once all loading flags are false.
      // Safe to call multiple times; calling before 90 lets the counter
      // continue past 90 without holding.
      window.oudLoaderDone = function () {
        if (finished) return;
        done = true;
      };

      rafId = requestAnimationFrame(frame);
    }());
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
